<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" font-family="Segoe UI,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="920" height="330" rx="18" fill="#f6f8fa"/><text x="28" y="40" font-size="22" font-weight="700" fill="#1f2328">B · Download ZIP — ChatGPT / Codex</text><text x="28" y="67" font-size="14" fill="#57606a">Install the kit through the local marketplace in Plugins Directory.</text><rect x="28" y="100" width="264" height="174" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="56" cy="130" r="15" fill="#1a7f37"/><text x="56" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="80" y="136" font-size="16" font-weight="700" fill="#1f2328">Download + extract</text><text x="46" y="171" font-size="14" fill="#57606a">Click Download agent kit ZIP.</text><text x="46" y="196" font-size="14" fill="#57606a">Right-click → Extract All.</text><text x="46" y="221" font-size="14" fill="#57606a">Keep the extracted folder.</text><path d="M301 187h18m-7-6 7 6-7 6" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><rect x="328" y="100" width="264" height="174" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="356" cy="130" r="15" fill="#1a7f37"/><text x="356" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="380" y="136" font-size="16" font-weight="700" fill="#1f2328">Open in Codex</text><text x="346" y="171" font-size="14" fill="#57606a">Choose nextra-rhinogh-kit.</text><text x="346" y="196" font-size="14" fill="#57606a">It contains AGENTS.md.</text><text x="346" y="221" font-size="14" fill="#57606a">Trust it; restart the app.</text><path d="M601 187h18m-7-6 7 6-7 6" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><rect x="628" y="100" width="264" height="174" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="656" cy="130" r="15" fill="#1a7f37"/><text x="656" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="680" y="136" font-size="16" font-weight="700" fill="#1f2328">Install Nextra</text><text x="646" y="171" font-size="14" fill="#57606a">Open Plugins Directory.</text><text x="646" y="196" font-size="14" fill="#57606a">Source: Nextra</text><text x="646" y="221" font-size="14" fill="#57606a">Nextra for Rhino → Install</text><text x="28" y="308" font-size="13" fill="#57606a">OpenAI local installation uses an extracted folder. Start a new chat after installing.</text></svg>
