</style><rect width="900" height="852" rx="14" fill="#f7f8fa"/><text x="24" y="33" font-size="22" class="" font-weight="600">OpenAI · B — Install from marketplace</text><circle cx="37" cy="72" r="13" class="number"/><text x="33" y="77" font-size="14" class="white" font-weight="700">1</text><text x="61" y="78" font-size="18" class="" font-weight="600">Open marketplace setup</text><g transform="translate(24 96)"><rect x="0" y="0" width="852" height="160" rx="10" class="paper"/><text x="28" y="41" font-size="24" class="" font-weight="600">Plugins → Add → Create plugin</text><text x="28" y="73" font-size="16" class="muted" font-weight="400">Choose marketplace setup where available.</text><rect x="28" y="99" width="196" height="38" rx="12" class="dark"/><text x="44" y="124" font-size="16" class="white" font-weight="600">Add a marketplace</text><rect x="24" y="95" width="204" height="46" rx="8" class="focus"/><text x="258" y="113" font-size="15" class="" font-weight="600">Managed workspace:</text><text x="258" y="137" font-size="15" class="muted" font-weight="400">Admin → Plugins → Add → Import marketplace</text></g><circle cx="37" cy="298" r="13" class="number"/><text x="33" y="303" font-size="14" class="white" font-weight="700">2</text><text x="61" y="304" font-size="18" class="" font-weight="600">Enter the repository → Add / sync</text><g transform="translate(24 322)"><rect x="0" y="0" width="852" height="230" rx="10" class="paper"/><text x="28" y="43" font-size="25" class="" font-weight="600">Add a marketplace</text><text x="28" y="83" font-size="15" class="" font-weight="600">Repository URL</text><rect x="28" y="95" width="796" height="44" rx="10" class="blue"/><text x="45" y="123" font-size="17" class="" font-weight="400">https://github.com/Tatsuki0123/nextra-rhinogh</text><text x="28" y="164" font-size="14" class="muted" font-weight="400">Use the repository root, without a branch or folder URL.</text><rect x="708" y="180" width="116" height="38" rx="12" class="dark"/><text x="724" y="205" font-size="16" class="white" font-weight="600">Add / sync</text><rect x="24" y="91" width="804" height="52" rx="8" class="focus"/><circle cx="828" cy="91" r="13" class="number"/><text x="824" y="96" font-size="14" class="white" font-weight="700">1</text><rect x="704" y="176" width="124" height="46" rx="8" class="focus"/><circle cx="828" cy="176" r="13" class="number"/><text x="824" y="181" font-size="14" class="white" font-weight="700">2</text></g><circle cx="37" cy="594" r="13" class="number"/><text x="33" y="599" font-size="14" class="white" font-weight="700">3</text><text x="61" y="600" font-size="18" class="" font-weight="600">Select Nextra → Install</text><g transform="translate(24 618)"><rect x="0" y="0" width="852" height="180" rx="10" class="paper"/><text x="28" y="43" font-size="25" class="" font-weight="600">Nextra marketplace</text><rect x="28" y="65" width="796" height="90" rx="10" class="paper"/><rect x="48" y="87" width="44" height="44" rx="10" class="dark"/><text x="60" y="117" font-size="26" class="white" font-weight="700">N</text><text x="111" y="101" font-size="19" class="" font-weight="600">Nextra for Rhino</text><text x="111" y="128" font-size="15" class="muted" font-weight="400">Rhino + Grasshopper tools and skill</text><rect x="705" y="90" width="96" height="38" rx="12" class="dark"/><text x="721" y="115" font-size="16" class="white" font-weight="600">Install</text><rect x="701" y="86" width="104" height="46" rx="8" class="focus"/></g><text x="24" y="833" font-size="13" class="muted" font-weight="400">Simplified guide based on the app UI · labels may vary by version.</text></svg>
