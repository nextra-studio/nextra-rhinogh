<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" font-family="Segoe UI,Helvetica,Arial,sans-serif"><rect x="0" y="0" width="920" height="330" rx="18" fill="#f6f8fa"/><text x="28" y="40" font-size="22" font-weight="700" fill="#1f2328">B · Download and upload ZIP</text><text x="28" y="67" font-size="14" fill="#57606a">Choose the Claude or GPT plugin download in the README.</text><rect x="28" y="100" width="264" height="174" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="56" cy="130" r="15" fill="#1a7f37"/><text x="56" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="80" y="136" font-size="16" font-weight="700" fill="#1f2328">Download ZIP</text><text x="46" y="171" font-size="14" fill="#57606a">Click your app’s download.</text><text x="46" y="196" font-size="14" fill="#57606a">Save the plugin ZIP.</text><text x="46" y="221" font-size="14" fill="#57606a">Tools + skill are included.</text><path d="M301 187h18m-7-6 7 6-7 6" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><rect x="328" y="100" width="264" height="174" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="356" cy="130" r="15" fill="#1a7f37"/><text x="356" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="380" y="136" font-size="16" font-weight="700" fill="#1f2328">Import plugin</text><text x="346" y="171" font-size="14" fill="#57606a">GPT: Create plugin →</text><text x="346" y="196" font-size="14" fill="#57606a">Upload plugin archive</text><text x="346" y="221" font-size="14" fill="#57606a">Select the downloaded ZIP.</text><path d="M601 187h18m-7-6 7 6-7 6" fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><rect x="628" y="100" width="264" height="174" rx="14" fill="#fff" stroke="#d0d7de"/><circle cx="656" cy="130" r="15" fill="#1a7f37"/><text x="656" y="135" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="680" y="136" font-size="16" font-weight="700" fill="#1f2328">Finish installation</text><text x="646" y="171" font-size="14" fill="#57606a">Complete the import.</text><text x="646" y="196" font-size="14" fill="#57606a">Start a new session.</text><text x="646" y="221" font-size="14" fill="#57606a">Keep Rhino open.</text><text x="28" y="308" font-size="13" fill="#57606a">Claude Desktop uses Cowork for local Rhino tools. Diagram labels may differ from your app.</text></svg>
