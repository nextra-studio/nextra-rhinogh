<svg xmlns="http://www.w3.org/2000/svg" width="920" height="290" viewBox="0 0 920 290" font-family="Segoe UI,Helvetica,Arial,sans-serif"><rect width="920" height="290" rx="18" fill="#f6f8fa"/><text x="28" y="42" font-size="24" font-weight="700" fill="#1f2328">Choose your installation option</text><text x="28" y="70" font-size="14" fill="#57606a">Install in Rhino first. Then choose A or B for your AI app.</text><rect x="28" y="98" width="414" height="160" rx="14" fill="#fff" stroke="#d0d7de"/><rect x="46" y="117" width="38" height="38" rx="10" fill="#1a7f37"/><text x="65" y="143" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">A</text><text x="98" y="144" font-size="21" font-weight="700" fill="#1f2328">Add marketplace</text><text x="46" y="181" font-size="15" fill="#57606a">Claude: add the GitHub repository.</text><text x="46" y="206" font-size="15" fill="#57606a">Codex: open the marketplace folder.</text><text x="46" y="231" font-size="15" fill="#57606a">Select Nextra → Install.</text><rect x="478" y="98" width="414" height="160" rx="14" fill="#fff" stroke="#d0d7de"/><rect x="496" y="117" width="38" height="38" rx="10" fill="#1a7f37"/><text x="515" y="143" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">B</text><text x="548" y="144" font-size="21" font-weight="700" fill="#1f2328">Download ZIP</text><text x="496" y="181" font-size="15" fill="#57606a">Claude: upload the ZIP.</text><text x="496" y="206" font-size="15" fill="#57606a">Codex: extract and open the kit.</text><text x="496" y="231" font-size="15" fill="#57606a">Install Nextra in your app.</text></svg>
